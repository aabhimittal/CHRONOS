[project]
name = "chronos-vla"
version = "0.1.0"
description = "Deadline-aware serving for dual-system VLA policies (simulation)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest"]
docs = ["matplotlib"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["chronos"]
