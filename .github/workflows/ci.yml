name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pip install -e .[dev]
      - run: pytest -q
      - name: Demo page is up to date with sim.js, template and results
        run: python scripts/build_demo.py && git diff --exit-code docs/index.html
